; Hoptics-MC build environments. The build copies this file and the hoptics/ folder into a MeshCore checkout
; (commit in MESHCORE_PIN, patched with patches/meshcore.patch); MeshCore's platformio.ini loads it by name.
; Each env extends MeshCore's own board section and swaps its text screen for the Hoptics screens.

[hoptics_base]
build_flags =
  -D HOPTICS_UI
  -D HOPTICS_VERSION='"0.2.1-beta"'
  -UDISPLAY_CLASS
  -D DISPLAY_CLASS=HopticsDisplay
  -include $PROJECT_DIR/hoptics/hal/HopticsDisplay.h
  -D LV_CONF_INCLUDE_SIMPLE
  -I hoptics/config
  -I hoptics/ui
  -I hoptics/hal
  -I hoptics/net
lib_deps =
  https://github.com/lvgl/lvgl/archive/refs/tags/v9.6.0.zip
  lovyan03/LovyanGFX @ 1.2.7
  https://github.com/bitbank2/PNGdec.git#1.1.7

[hoptics_companion]
build_flags =
  -I hoptics/roles/companion
  -I examples/companion_radio
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter =
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../hoptics/ui/*.cpp>
  +<../hoptics/ui/map/*.cpp>
  +<../hoptics/ui/fonts/*.c>
  +<../hoptics/hal/*.cpp>
  +<../hoptics/net/*.cpp>
  +<../hoptics/roles/companion/*.cpp>

; ---------------------------------------------------------------- LilyGO T-Deck / T-Deck Plus
[env:hoptics_tdeck_companion]
extends = LilyGo_TDeck
board_build.partitions = default_16MB.csv
build_flags =
  ${LilyGo_TDeck.build_flags}
  ${hoptics_base.build_flags}
  ${hoptics_companion.build_flags}
  ; MeshCore's ESP32Board::begin() starts Wire on the chip's default pins (SDA 8, SCL 9) when these are unset, and
  ; radio_init()'s Wire.begin(18, 8) is then ignored: SCL lands on the LoRa chip-select and every I2C call times out
  ; (4 s in the RTC probe, ~2 minutes in the sensor scan, no keyboard or touch)
  -D PIN_BOARD_SDA=18
  -D PIN_BOARD_SCL=8
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  ${hoptics_companion.build_src_filter}
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  ${hoptics_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

; ---------------------------------------------------------------- Elecrow ThinkNode M9
[env:hoptics_m9_companion]
extends = ThinkNode_M9
build_flags =
  ${ThinkNode_M9.build_flags}
  ${hoptics_base.build_flags}
  ${hoptics_companion.build_flags}
  ; the GPS enable is active-low on M9 v1.0 and active-high on v1.1: decided at run time (ThinkNodeM9Board.cpp)
  -D HOPTICS_GPS_EN_ACTIVE
build_src_filter = ${ThinkNode_M9.build_src_filter}
  ${hoptics_companion.build_src_filter}
  +<helpers/ui/buzzer.cpp>
lib_deps =
  ${ThinkNode_M9.lib_deps}
  ${hoptics_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

; ---------------------------------------------------------------- Heltec V4 Expansion Kit (V4 + 2.8" touch screen)
; MeshCore's own TFT section (pins, radio, GPS); the screen and touch are driven by hoptics/hal/hx_hal_heltec.cpp
[env:hoptics_heltec_v4_companion]
extends = heltec_v4_tft
build_flags =
  ${heltec_v4_tft.build_flags}
  ${hoptics_base.build_flags}
  ${hoptics_companion.build_flags}
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
build_src_filter = ${heltec_v4_tft.build_src_filter}
  ${hoptics_companion.build_src_filter}
lib_deps =
  ${heltec_v4_tft.lib_deps}
  ${hoptics_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

; ---------------------------------------------------------------- Heltec V4-R8 Expansion Kit V2
[env:hoptics_heltec_v4_r8_companion]
extends = heltec_v4_r8_tft
build_flags =
  ${heltec_v4_r8_tft.build_flags}
  ${hoptics_base.build_flags}
  ${hoptics_companion.build_flags}
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
build_src_filter = ${heltec_v4_r8_tft.build_src_filter}
  ${hoptics_companion.build_src_filter}
lib_deps =
  ${heltec_v4_r8_tft.lib_deps}
  ${hoptics_base.lib_deps}
  densaugeo/base64 @ ~1.4.0
