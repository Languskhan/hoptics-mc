name: Build Hoptics-MC M7

# ThinkNode M7 images, built from agessaman's MeshCore observer firmware (MIT) at the commit in m7/OBSERVER_PIN.
on:
  push:
    branches: [main, beta]   # main publishes to m7-builds (stable), beta to m7-beta
    paths: ['m7/**', '.github/workflows/m7.yml']
  workflow_dispatch:

permissions:
  contents: write # publish the images to the m7-builds / m7-beta branch

jobs:
  build:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - Hoptics_M7_repeater_observer
          - Hoptics_M7_room_observer
          - ThinkNode_M7_repeater_observer_mqtt
          - ThinkNode_M7_room_server_observer_mqtt
          - ThinkNode_M7_repeater
          - ThinkNode_M7_room_server
          - ThinkNode_M7_companion_radio_ble
          - ThinkNode_M7_companion_radio_usb
          - ThinkNode_M7_companion_radio_ethernet
          - ThinkNode_M7_kiss_modem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch pinned observer firmware
        run: |
          PIN=$(cat m7/OBSERVER_PIN)
          git init -q mc && cd mc
          git remote add origin https://github.com/agessaman/MeshCore.git
          git fetch -q --depth 1 origin "$PIN"
          git checkout -q FETCH_HEAD
          for p in ../m7/patches/*.patch; do git apply --whitespace=nowarn "$p"; done
          cp ../m7/src/* src/helpers/esp32/
          python ../m7/tools/make_page.py ../m7/web/hoptics.html src/helpers/esp32/HopticsPage.h

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-m7-${{ matrix.env }}-${{ hashFiles('m7/OBSERVER_PIN', 'm7/patches/*') }}
          restore-keys: pio-m7-${{ matrix.env }}-

      - name: Build
        working-directory: mc
        run: |
          pip install --quiet platformio
          pio run -e ${{ matrix.env }}
          pio run -e ${{ matrix.env }} -t mergebin || true
          ls -la .pio/build/${{ matrix.env }}/*.bin

      - name: Collect
        run: |
          OUT=out/${{ matrix.env }}
          mkdir -p $OUT
          B=mc/.pio/build/${{ matrix.env }}
          cp $B/firmware.bin $OUT/${{ matrix.env }}.update.bin
          [ -f $B/firmware-merged.bin ] && cp $B/firmware-merged.bin $OUT/${{ matrix.env }}.factory.bin
          cp $B/partitions.bin $OUT/ 2>/dev/null || true
          (cd $OUT && sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # the dashboard reads this to offer updates and role changes
          sed -n "s/.*HOPTICS_M7_VERSION='\"\([0-9.]*\)\"'.*/\1/p" mc/variants/thinknode_m7/platformio.ini | head -1 > $OUT/version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}
          path: out/${{ matrix.env }}
          retention-days: 30

  # the images, on a branch of their own (replaced on every build), so they can be fetched with git
  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Push the images
        env:
          DEST: ${{ github.ref_name == 'main' && 'm7-builds' || 'm7-beta' }}
        run: |
          cd out
          # never publish a set missing the Hoptics images: the dashboards update from these folders
          for d in Hoptics_M7_repeater_observer Hoptics_M7_room_observer; do
            [ -s "$d/$d.update.bin" ] && [ -s "$d/SHA256SUMS.txt" ] || { echo "missing $d, not publishing"; exit 1; }
          done
          git init -q -b "$DEST"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "M7 images from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "$DEST"
